  <path d="M100 40L150 70V130L100 160L50 130V70L100 40Z" stroke="#ff00fc" stroke-width="2" fill="none" />
  <path d="M70 140V70" stroke="#00ffff" stroke-width="8" stroke-linecap="round" />
  <path d="M130 70V140" stroke="#00ffff" stroke-width="8" stroke-linecap="round" />
